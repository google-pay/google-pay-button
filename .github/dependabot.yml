version: 2
updates:
  # Scan the root package.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      typescript-eslint:
        patterns:
          - 'typescript-eslint*'
          - '@typescript-eslint/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
      jest:
        patterns:
          - 'jest*'
          - '@types/jest*'
          - 'ts-jest*'

  # Scan the Custom Element library
  - package-ecosystem: 'npm'
    directory: '/src/button-element'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # Scan the React library
  - package-ecosystem: 'npm'
    directory: '/src/button-react'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7

  # Scan the Angular library
  - package-ecosystem: 'npm'
    directory: '/src/button-angular'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'ng-packagr'
